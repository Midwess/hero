name: Documentation Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse public artifact publication
        if: ${{ github.event.repository.visibility == 'public' }}
        run: |
          echo "Documentation bundles are restricted to private or internal repositories."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: scripts/build-docs-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hero-documentation-${{ github.sha }}
          path: target/docs-bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 90
