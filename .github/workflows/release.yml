name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

concurrency:
  group: hero-crates-io-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep
      - name: Detect version bump
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 | jq --raw-output \
            '.packages[] | select(.name == "midwess-hero") | .version')
          if [[ ! "$version" =~ ^([1-9][0-9]*)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "release versions must be stable semantic versions at or above 1.0.0" >&2
            exit 1
          fi
          current_major=${BASH_REMATCH[1]}
          current_minor=${BASH_REMATCH[2]}
          current_patch=${BASH_REMATCH[3]}

          previous_version=""
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && \
             git cat-file -e "$BEFORE_SHA:Cargo.toml" 2>/dev/null; then
            previous_version=$(git show "$BEFORE_SHA:Cargo.toml" | awk '
              /^\[package\]$/ { in_package = 1; next }
              in_package && /^\[/ { exit }
              in_package && /^version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/"[[:space:]]*$/, "", value)
                print value
                exit
              }
            ')
          fi

          if [[ "$version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml changed without a package version bump; skipping release."
            exit 0
          fi

          if [[ -n "$previous_version" ]]; then
            if [[ ! "$previous_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "previous package version is not a stable semantic version: $previous_version" >&2
              exit 1
            fi
            previous_major=${BASH_REMATCH[1]}
            previous_minor=${BASH_REMATCH[2]}
            previous_patch=${BASH_REMATCH[3]}
            if (( current_major < previous_major ||
                  (current_major == previous_major && current_minor < previous_minor) ||
                  (current_major == previous_major && current_minor == previous_minor && current_patch <= previous_patch) )); then
              echo "package version must increase: $previous_version -> $version" >&2
              exit 1
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing Hero $version."
      - name: Validate release
        if: steps.release.outputs.changed == 'true'
        run: |
          cargo fmt --all -- --check
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          scripts/check-features.sh --all
          scripts/check-exclusions.sh
          scripts/check-docs.sh
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --target wasm32-unknown-unknown --no-default-features --features cancellation,config,distributed-id,env,finally,logger,maybe,never-send,number,pool,retry,stream,string,throttle-future,time,wasm,yield-container
          cargo publish --dry-run --locked
      - name: Check crates.io index
        if: steps.release.outputs.changed == 'true'
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/crates-io-index.jsonl \
            --write-out '%{http_code}' \
            --user-agent 'midwess-hero-release-workflow/1.0 (https://github.com/Midwess/hero)' \
            "https://index.crates.io/mi/dw/midwess-hero")
          case "$status" in
            200)
              if jq --slurp --exit-status --arg version "$VERSION" \
                'any(.[]; .vers == $version)' /tmp/crates-io-index.jsonl >/dev/null; then
                echo "exists=true" >> "$GITHUB_OUTPUT"
                echo "midwess-hero $VERSION is already published; skipping Cargo upload."
              else
                echo "exists=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io returned HTTP $status" >&2
              exit 1
              ;;
          esac
      - name: Publish to crates.io
        if: steps.release.outputs.changed == 'true' && steps.registry.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not available to this repository" >&2
            exit 1
          fi
          cargo publish --locked
      - name: Create GitHub release
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Hero $VERSION" \
            --generate-notes
