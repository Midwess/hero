name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo test --features native-full
      - run: cargo clippy --all-targets --features native-full -- -D warnings
      - run: scripts/check-features.sh
      - run: scripts/check-exclusions.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --features web-full
      - run: cargo clippy --target wasm32-unknown-unknown --features web-full -- -D warnings
