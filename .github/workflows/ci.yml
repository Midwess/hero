name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: scripts/check-features.sh --native
      - run: scripts/check-exclusions.sh
      - run: scripts/check-docs.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: scripts/check-features.sh --wasm
      - run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features cancellation,config,distributed-id,env,finally,logger,maybe,never-send,number,pool,retry,stream,string,throttle-future,time,wasm,yield-container -- -D warnings
