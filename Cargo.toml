[package]
name = "core-services"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
backend = ["db-remote", "grpc-client", "grpc-server", "host_machine", "retry", "s3", "services", "smtp", "local-storage", "tokio"]
grpc-client = ["tonic/transport"]
grpc-server = ["tonic", "tonic-middleware", "jsonwebtoken"]
host_machine = ["tokio/process", "tokio/fs", "tokio/io-std", "tokio-stream", "tokio"]
local-storage = ["tokio/fs", "tokio/io-std", "tokio/io-util", "md5", "flate2", "zip"]
zip = ["async_zip"]
retry = []
s3 = ["aws-config", "aws-sdk-s3", "aws-smithy-async", "schema", "tokio"]
services = []
smtp = ["lettre", "reqwest", "prost", "lettre/smtp-transport", "lettre/builder", "lettre/default", "schema"]
db-remote = ["surrealdb", "surreal_devl", "surreal_derive_plus", "surrealdb/protocol-ws"]
db-red = ["redb", "bincode"]
db-idb = ["idb", "wasm-bindgen", "serde-wasm-bindgen"]
wasm = ["web-sys", "js-sys", "wasm-logger", "wasm-bindgen", "wasm-bindgen-futures", "wasm-streams"]
wasm-logger = ["console_log", "console_error_panic_hook", "web-sys", "js-sys"]
token = ["jsonwebtoken"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = {  version = "1.0.117", features = ["indexmap", "preserve_order"]}
thiserror = "2.0.12"
async-trait = "0.1.88"
futures-util.version = "0.3.31"
pretty_env_logger = { version = "0.5.0" }
log = "0.4.22"
schema = { path = "../schema/rust", default-features = false, optional = true }
lazy_static = "1.5.0"
anyhow = "1.0.98"
futures-timer = "3.0.3"
futures = "0.3.31"
chrono = "0.4.42"
n0-future = "0.1.3"
once_cell = { version = "1.21.3", default-features = false }

# Optional dependencies based on features
tokio = { version = "1.46.1", default-features = false, features = ["rt", "sync"], optional = true }
async_zip = { git = "https://github.com/dev-logs/rs-async-zip.git", features = ["full-wasm"], optional = true }
bincode = { version = "1.3.3", optional = true }
md5 = { version = "0.7.0", optional = true }
flate2 = { version = "1.1.1", optional = true }
tokio-stream = { version = "0.1.16", default-features = false, optional = true }
tonic = { version = "0.13.1", optional = true }
prost = { version = "0.13.5", optional = true }
tonic-middleware = { version = "0.1.4", optional = true }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.41.0", optional = true }
lettre = { version = "0.11.7", optional = true }
surrealdb = { version = "2.3.6", default-features = false, optional = true }
surreal_devl = { version = "2.2.4", optional = true }
surreal_derive_plus = { version = "2.2.5", optional = true }
jsonwebtoken = { version = "9.3.0", optional = true }
reqwest = { version = "0.12.22", optional = true }
bytes = {  version = "1.10.1"}
aws-smithy-async = {version = "1.2.5", optional = true}
redb = { version = "^3.0.0", optional = true }
idb = { version = "0.6.4", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-streams = { version = "0.4.2", optional = true }

web-sys = { version = "0.3.80", optional = true, features = ["XmlHttpRequest", "Window", "EventTarget", "ProgressEvent", "Document", "Blob", "AbortController", "Request", "RequestInit", "AbortSignal", "Response", "Headers", "XmlHttpRequestUpload"]}
js-sys = { version = "0.3.80", optional = true }
console_log = { version = "1.0.0", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen-futures = { version = "0.4.53", optional = true }
wasm-bindgen = { version = "0.2.103", optional = true }

[build-dependencies]

[package.metadata]
# Will log the query command at runtime
surreal_enable_log = true
# Will log the generated code at build time
surreal_enable_compile_log = true
# Change the naming convention of generated statement into camel case
surreal_use_camel_case = false
# The log namespace, apply for both build time log and runtime log
surreal_namespace = "surrealql"
# The macro name that use for info log
surreal_info_log_macro = "log::info"
# The macro name that use for warning log
surreal_warn_log_macro = "log::info"
