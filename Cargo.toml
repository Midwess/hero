[package]
name = "devlog-sdk"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1

[dependencies]
core-services = { path="../core-services" }
schema = { path="../schema/rust" }
surreal_derive_plus = "2.2.0"
surreal_devl = "2.2.0"
surrealdb = {version="2.1.4", default-features = false, features = ["protocol-ws"]}
lazy_static = "1.5.0"
log = "0.4.22"
chrono = "0.4.38"
serde = {version="1.0.203", features=["derive"]}
serde_derive = "1.0.203"
serde_json = "1.0.117"
jsonwebtoken = "9.3.0"
once_cell = "1.19.0"
tokio = {version = "1.28.2", features = ["sync"]}
tonic = "0.11.0"
tonic-middleware = "0.1.4"
async-trait = "0.1.13"
lettre = "0.11.7"
aws-sdk-s3 = "1.41.0"
reqwest = { version = "0.12.9", features = ["json"] }
thiserror = "1.0.61"
