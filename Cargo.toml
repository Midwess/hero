[package]
name = "core-services"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1

[dependencies]
prost = "0.12.6"
prost-types = "0.12.6"
serde = {version="1.0.203", features=["derive"]}
schema = { path = "../schema/rust" }
serde_derive.workspace = true
serde_json.workspace = true
surrealdb = {workspace = true, features = ["protocol-ws"]}
surreal_devl.workspace = true
surreal_derive_plus.workspace = true
thiserror.workspace = true
tonic = "0.11.0"
jsonwebtoken = "9.3.0"
tokio.workspace = true
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.41.0"
lazy_static.workspace = true
pretty_env_logger = "0.5.0"
chrono.workspace = true
once_cell.workspace = true
tonic-middleware = "0.1.4"
log.workspace = true
lettre = "0.11.7"
reqwest = "0.12.5"
async-trait.workspace = true
tokio-scoped = "0.2.0"
tokio-stream = "0.1.16"

[build-dependencies]
tonic-build = "0.11"
