[package]
name = "devlog-sdk"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 0
debug = 1
strip = false
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = false
panic = "unwind"
debug-assertions = true
overflow-checks = true
rpath = false

[features]
full = ["grpc-client", "grpc-server", "db-local", "db-remote", "gateway", "s3"]
grpc-client = ["tonic/transport", "tonic/codegen", "tonic/prost"]
grpc-server = ["tonic", "tonic-middleware", "core-services/grpc-server"]
db-local = ["surrealdb/kv-surrealkv", "surreal_devl", "surreal_derive_plus", "core-services/retry", "core-services/db-local"]
db-remote = ["surrealdb/protocol-ws", "surreal_devl", "surreal_derive_plus", "core-services/retry", "core-services/db-remote"]
gateway = ["reqwest", "reqwest/json"]
s3 = ["core-services/s3", "aws-sdk-s3"]

[dependencies]
core-services = { path="../core-services", default-features = false }
schema = { path="../schema/rust" }
log.workspace = true
chrono.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
lazy_static.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true

surreal_derive_plus = { workspace = true, optional = true }
surreal_devl = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
tonic-middleware = { version = "0.1.4", optional = true }
tonic = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
aws-sdk-s3 = { version = "1.76.0", optional = true }
