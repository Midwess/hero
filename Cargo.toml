[package]
name = "hero"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared cross-platform runtime and service integration utilities"
repository = "https://github.com/Midwess/hero"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["distributed-id", "retry"]
retry = ["dep:rand"]
distributed-id = ["dep:rand"]
distributed-id-etcd = ["distributed-id", "dep:etcd-client"]
shell = ["dep:tokio-stream"]
tcp = ["dep:socket2"]
grpc-client = ["dep:tonic"]
grpc-server = ["tcp", "dep:tonic"]
gateway = ["dep:reqwest", "dep:regex"]
s3 = ["dep:aws-sdk-s3"]
smtp = ["dep:lettre"]
token = ["dep:jsonwebtoken"]
wasm = ["dep:anyhow", "dep:bytes", "dep:wasm-bindgen-futures", "dep:wasm-streams"]
native-full = [
    "retry",
    "distributed-id-etcd",
    "shell",
    "tcp",
    "grpc-client",
    "grpc-server",
    "gateway",
    "s3",
    "smtp",
    "token",
]
web-full = ["retry", "distributed-id", "wasm"]

[dependencies]
async-trait = "0.1.88"
chrono = "0.4.39"
event-listener = "5.4.1"
futures = "0.3.31"
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
futures-util = "0.3.31"
log = "0.4.27"
n0-future = "0.2.0"
parking_lot = "0.12.5"
rand = { version = "0.9.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["indexmap", "preserve_order"] }
thiserror = "2.0.12"
tokio = { version = "1.46.1", default-features = false, features = ["rt", "sync", "time"] }
validator = "0.20.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-sdk-s3 = { version = "=1.142.0", optional = true }
env_logger = "0.10"
etcd-client = { version = "0.17.0", optional = true }
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"], optional = true }
lettre = { version = "0.11.7", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"], optional = true }
pretty_env_logger = "0.5.0"
regex = { version = "1.11.1", optional = true }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"], optional = true }
socket2 = { version = "0.6.3", optional = true }
tokio = { version = "1.46.1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.16", default-features = false, optional = true }
tonic = { version = "0.13.1", default-features = false, features = ["transport"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow = { version = "1.0.98", optional = true }
bytes = { version = "1.10.1", optional = true }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.80"
wasm-bindgen = "0.2.103"
wasm-bindgen-futures = { version = "0.4.53", optional = true }
wasm-streams = { version = "0.4.2", optional = true }
web-sys = { version = "0.3.80", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "Document",
    "Event",
    "EventTarget",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "Headers",
    "Navigator",
    "Performance",
    "ProgressEvent",
    "Request",
    "RequestInit",
    "Response",
    "StorageManager",
    "Window",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
    "console",
] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.46.1", default-features = false, features = ["rt-multi-thread", "test-util"] }

