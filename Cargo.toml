[package]
name = "devlog-sdk"
version = "0.1.0"
edition = "2021"

[features]
default = []
full = ["grpc-client", "grpc-server", "db-local", "db-remote", "gateway", "s3"]
grpc-client = ["tonic/transport"]
grpc-server = ["tonic", "tonic-middleware", "core-services/grpc-server", "gateway", "tcp"]
db-local = ["surrealdb", "surreal_devl", "surreal_derive_plus", "core-services/retry", "core-services/db-local", "futures-util"]
db-remote = ["surrealdb/protocol-ws", "surreal_devl", "surreal_derive_plus", "core-services/retry", "core-services/db-remote", "futures-util"]
gateway = ["reqwest", "reqwest/json"]
tcp = []
s3 = ["core-services/s3", "aws-sdk-s3", "aws-smithy-async"]

[dependencies]
core-services = { path="../core-services", default-features = false }
log = "0.4.27"
chrono = "0.4.41"
serde = { version = "1.0.219", features = ["derive"], default-features = false }
serde_json = { version = "1.0.117"}
lazy_static = "1.5.0"
tokio = {version = "1.46.1", default-features = false}
async-trait = "0.1.88"
thiserror ="2.0.12"

futures-util = { version = "0.3.31", optional = true }
surrealdb = { version = "2.3.6", default-features = false, optional = true }
surreal_devl = { version = "2.2.2", optional = true }
surreal_derive_plus = { version = "2.2.3", optional = true }
tonic-middleware = { version = "0.1.4", optional = true }
tonic = { version = "0.13.1", optional = true }
aws-sdk-s3 = { version = "1.76.0", optional = true }
reqwest = { version = "0.12.22", default-features = false, optional = true }
aws-smithy-async = {version = "1.2.5", optional = true}
