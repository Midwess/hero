[package]
name = "core-services"
version = "0.1.0"
edition = "2021"

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/local/bin/mold"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
prost = "0.12.6"
prost-types = "0.12.6"
serde = {version="1.0.203", features=["derive"]}
schema = { git ="ssh://git@github.com/dev-logs/schema.git" }
serde_derive = "1.0.203"
serde_json = "1.0.117"
surreal_derive_plus = "1.0.9"
surreal_devl = "1.0.6"
surrealdb = {version="1.5.4", default-features = false, features = ["protocol-ws"]}
surrealdb_id = "0.1.2"
thiserror = "1.0.61"
tonic = "0.11.0"
jsonwebtoken = "9.3.0"
tokio = {version = "1.28.2", features = ["sync"]}
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.41.0"
lazy_static = "1.5.0"
pretty_env_logger = "0.5.0"
chrono = "0.4.38"
once_cell = "1.19.0"
tonic-middleware = "0.1.4"
log = "0.4.22"
lettre = "0.11.7"
reqwest = "0.12.5"
async-trait = "0.1.13"

[build-dependencies]
tonic-build = "0.11"
