[package]
name = "midwess-hero"
version = "0.1.0"
edition = "2021"
description = "Opt-in cross-platform runtime and service integration utilities"
repository = "https://github.com/Midwess/hero"
homepage = "https://github.com/Midwess/hero"
documentation = "https://docs.rs/midwess-hero"
readme = "README.md"
license = "MIT"
keywords = ["midwess", "async", "infrastructure", "wasm", "gateway"]
categories = ["asynchronous", "web-programming"]

[lib]
name = "hero"
crate-type = ["rlib", "cdylib"]

[features]
default = []
api-gateway = ["dep:async-trait", "dep:log", "dep:regex", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror"]
cancellation = ["dep:event-listener", "dep:futures", "dep:futures-timer", "dep:futures-util", "dep:n0-future", "dep:parking_lot", "dep:serde", "dep:thiserror", "dep:tokio"]
config = []
distributed-id = ["dep:chrono", "dep:futures-timer", "dep:n0-future", "dep:rand", "dep:thiserror", "dep:tokio", "dep:getrandom"]
distributed-id-etcd = ["distributed-id", "dep:etcd-client", "dep:log", "dep:n0-future", "dep:serde_json", "tokio/time"]
env = []
finally = ["dep:futures-util", "dep:n0-future"]
grpc-gateway = ["config", "dep:tokio", "dep:tonic"]
logger = ["dep:console_error_panic_hook", "dep:env_logger", "dep:futures-util", "dep:js-sys", "dep:log", "dep:n0-future", "dep:pretty_env_logger", "dep:wasm-bindgen", "dep:web-sys", "web-sys/console"]
maybe = []
never-send = []
number = ["dep:n0-future"]
pool = ["maybe", "dep:async-trait", "dep:futures", "dep:futures-timer", "dep:futures-util", "dep:log", "dep:n0-future", "dep:thiserror"]
retry = ["dep:futures-timer", "dep:log", "dep:rand", "dep:tokio", "dep:getrandom", "tokio/time"]
s3 = ["dep:aws-sdk-s3", "dep:serde", "dep:thiserror"]
shell = ["dep:tokio", "dep:tokio-stream", "tokio/io-util", "tokio/process"]
smtp = ["cancellation", "dep:lettre", "dep:thiserror"]
stream = ["dep:futures"]
string = ["dep:validator"]
task = ["dep:tokio"]
tcp = ["dep:log", "dep:socket2", "dep:thiserror", "dep:tokio", "tokio/net"]
grpc-server = ["tcp", "dep:tonic"]
throttle-future = ["dep:futures-util", "dep:n0-future"]
time = ["dep:js-sys", "dep:web-sys", "web-sys/Performance", "web-sys/Window"]
token = ["dep:chrono", "dep:jsonwebtoken", "dep:serde", "dep:thiserror"]
wasm = ["dep:anyhow", "dep:bytes", "dep:futures", "dep:futures-util", "dep:js-sys", "dep:serde", "dep:serde_json", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:wasm-streams", "dep:web-sys", "web-sys/AbortController", "web-sys/AbortSignal", "web-sys/Blob", "web-sys/Event", "web-sys/EventTarget", "web-sys/File", "web-sys/FileSystemReadWriteOptions", "web-sys/FileSystemSyncAccessHandle", "web-sys/Headers", "web-sys/ProgressEvent", "web-sys/Request", "web-sys/RequestInit", "web-sys/Response", "web-sys/Window", "web-sys/XmlHttpRequest", "web-sys/XmlHttpRequestUpload"]
yield-container = ["dep:futures-timer", "dep:futures-util", "dep:n0-future", "dep:thiserror"]

[dependencies]
async-trait = { version = "0.1.88", optional = true }
chrono = { version = "0.4.39", optional = true }
event-listener = { version = "5.4.1", optional = true }
futures = { version = "0.3.31", optional = true }
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"], optional = true }
futures-util = { version = "0.3.31", optional = true }
log = { version = "0.4.27", optional = true }
n0-future = { version = "0.2.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }
rand = { version = "0.9.0", optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.117", features = ["indexmap", "preserve_order"], optional = true }
thiserror = { version = "2.0.12", optional = true }
tokio = { version = "1.46.1", default-features = false, features = ["rt", "sync"], optional = true }
validator = { version = "0.20.0", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-sdk-s3 = { version = "=1.142.0", optional = true }
env_logger = { version = "0.10", optional = true }
etcd-client = { version = "0.17.0", optional = true }
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"], optional = true }
lettre = { version = "0.11.7", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"], optional = true }
pretty_env_logger = { version = "0.5.0", optional = true }
regex = { version = "1.11.1", optional = true }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"], optional = true }
socket2 = { version = "0.6.3", optional = true }
tokio-stream = { version = "0.1.16", default-features = false, optional = true }
tonic = { version = "0.13.1", default-features = false, features = ["transport"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow = { version = "1.0.98", optional = true }
bytes = { version = "1.10.1", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
getrandom = { version = "0.3.4", features = ["wasm_js"], optional = true }
js-sys = { version = "0.3.80", optional = true }
wasm-bindgen = { version = "0.2.103", optional = true }
wasm-bindgen-futures = { version = "0.4.53", optional = true }
wasm-streams = { version = "0.4.2", optional = true }
web-sys = { version = "0.3.80", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.46.1", default-features = false, features = ["rt-multi-thread", "test-util"] }
