[package]
name = "core-services"
version = "0.1.0"
edition = "2021"

[features]
full = ["db-local", "db-remote", "grpc-client", "grpc-server", "host_machine", "retry", "s3", "services", "smtp", "local-storage"]
grpc-client = ["tonic/transport"]
grpc-server = ["tonic", "tonic-middleware", "jsonwebtoken"]
host_machine = ["tokio-stream", "tokio/process"]
retry = []
s3 = ["aws-config", "aws-sdk-s3", "aws-smithy-async"]
services = []
smtp = ["lettre", "reqwest", "prost", "lettre/smtp-transport", "lettre/builder", "lettre/default"]
db-remote = ["surrealdb/default", "surreal_devl", "surreal_derive_plus", "surrealdb/protocol-ws"]
db-local = ["surrealdb", "surrealdb/kv-surrealkv", "surreal_devl", "surreal_derive_plus"]
local-storage = ["md5", "zip", "bytes", "flate2", "tar"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_derive.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-scoped.workspace = true
pretty_env_logger = { version = "0.5.0" }
log.workspace = true
schema = { path = "../schema/rust" }
lazy_static.workspace = true
chrono.workspace = true
anyhow.workspace = true
rand.workspace = true

# Optional dependencies based on features
zip = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tokio-stream = { version = "0.1.17", optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-middleware = { version = "0.1.4", optional = true }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.41.0", optional = true }
lettre = { version = "0.11.7", optional = true }
surrealdb = { workspace = true, optional = true }
surreal_devl = { workspace = true, optional = true }
surreal_derive_plus = { workspace = true, optional = true }
jsonwebtoken = { version = "9.3.0", optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
aws-smithy-async = {workspace = true, optional = true}

[build-dependencies]

[package.metadata]
# Will log the query command at runtime
surreal_enable_log = true
# Will log the generated code at build time
surreal_enable_compile_log = true
# Change the naming convention of generated statement into camel case
surreal_use_camel_case = false
# The log namespace, apply for both build time log and runtime log
surreal_namespace = "surrealql"
# The macro name that use for info log
surreal_info_log_macro = "log::info"
# The macro name that use for warning log
surreal_warn_log_macro = "log::info"