[package]
name = "devlog-sdk"
version = "0.1.0"
edition = "2021"

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/local/bin/mold"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
core-services = { git="ssh://git@github.com/dev-logs/core-services.git" }
schema = { git="ssh://git@github.com/dev-logs/schema.git" }
surreal_derive_plus = "1.0.9"
surreal_devl = "1.0.6"
surrealdb = {version="1.5.4", default-features = false, features = ["protocol-ws"]}
surrealdb_id = "0.1.2"
lazy_static = "1.5.0"
log = "0.4.22"
chrono = "0.4.38"
serde = {version="1.0.203", features=["derive"]}
serde_derive = "1.0.203"
serde_json = "1.0.117"
jsonwebtoken = "9.3.0"
once_cell = "1.19.0"
tokio = {version = "1.28.2", features = ["sync"]}
tonic = "0.11.0"
tonic-middleware = "0.1.4"
